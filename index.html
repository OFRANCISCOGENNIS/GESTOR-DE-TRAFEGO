<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>TrafegoAI — Gestor de tráfego pago</title>
<meta name="description" content="Gerencie campanhas de Google, Meta e TikTok Ads com seus próprios dados.">
<meta name="theme-color" content="#6d4aff">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236d4aff'/%3E%3Cpath d='M14 42l12-12 8 8 16-16' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<style>
  :root{
    --bg:#f6f7fb; --surface:#ffffff; --surface2:#eef1f8; --border:#e3e7f1;
    --fg:#161a27; --muted:#5c6379;
    --brand:#6d4aff; --brand2:#9a7bff; --brand-soft:#ece7ff;
    --good:#16a34a; --warn:#d97706; --bad:#dc2626;
    --shadow:0 1px 2px rgba(20,26,50,.06),0 8px 24px rgba(20,26,50,.06);
    --r:16px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0a0d16; --surface:#121727; --surface2:#1a2036; --border:#262d43;
      --fg:#e9ecf5; --muted:#949cb4;
      --brand:#8b6dff; --brand2:#6d4aff; --brand-soft:#221c3f;
      --good:#22c55e; --warn:#f59e0b; --bad:#ef4444;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"]{
    --bg:#f6f7fb; --surface:#ffffff; --surface2:#eef1f8; --border:#e3e7f1;
    --fg:#161a27; --muted:#5c6379; --brand:#6d4aff; --brand2:#9a7bff; --brand-soft:#ece7ff;
    --good:#16a34a; --warn:#d97706; --bad:#dc2626;
    --shadow:0 1px 2px rgba(20,26,50,.06),0 8px 24px rgba(20,26,50,.06);
  }
  :root[data-theme="dark"]{
    --bg:#0a0d16; --surface:#121727; --surface2:#1a2036; --border:#262d43;
    --fg:#e9ecf5; --muted:#949cb4; --brand:#8b6dff; --brand2:#6d4aff; --brand-soft:#221c3f;
    --good:#22c55e; --warn:#f59e0b; --bad:#ef4444;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{max-width:100%;overflow-x:hidden}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
  .num{font-variant-numeric:tabular-nums}
  h1,h2,h3{margin:0;letter-spacing:-.02em;font-weight:750}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .app{display:flex;min-height:100vh;width:100%}
  .side{flex:0 0 250px;align-self:flex-start;position:sticky;top:0;height:100vh;overflow-y:auto;
    background:var(--surface);border-right:1px solid var(--border);
    padding:18px 14px;display:flex;flex-direction:column;gap:4px}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));
    display:grid;place-items:center;color:#fff;flex:0 0 auto}
  .brand b{font-size:18px;letter-spacing:-.03em}
  .nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
  .navsec{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
    padding:14px 11px 5px}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border:0;border-radius:11px;
    background:transparent;color:var(--muted);font-size:14px;font-weight:550;text-align:left;transition:.15s}
  .nav button:hover{background:var(--surface2);color:var(--fg)}
  .nav button.on{background:var(--brand);color:#fff}
  .nav svg{width:18px;height:18px;flex:0 0 auto}
  .side .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:8px;line-height:1.5}

  .main{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
  .top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 24px;background:color-mix(in srgb,var(--surface) 86%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .content{padding:22px 24px 60px;max-width:1440px;width:100%;min-width:0}
  .pagehead{margin-bottom:18px}
  .pagehead h1{font-size:24px}
  .pagehead p{margin:5px 0 0;color:var(--muted);font-size:14px}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
  .grid{display:grid;gap:14px}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .pill.g{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
  .pill.w{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
  .pill.b{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
  .pill.m{background:var(--surface2);color:var(--muted)}
  .pill.v{background:var(--brand-soft);color:var(--brand)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:11px;
    border:1px solid var(--border);background:var(--surface2);color:var(--fg);font-size:13.5px;font-weight:600;transition:.15s}
  .btn:hover{border-color:var(--brand)}
  .btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.p:hover{filter:brightness(1.07)}
  .btn.d{color:var(--bad)}
  .btn.d:hover{border-color:var(--bad)}
  .btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
  .iconbtn{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface2);color:var(--fg);position:relative}
  .iconbtn:hover{border-color:var(--brand)}
  .up{color:var(--good)} .down{color:var(--bad)}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .inp{width:100%;padding:9px 11px;border-radius:11px;border:1px solid var(--border);
    background:var(--surface2);color:var(--fg);font-size:13.5px}
  .inp:focus{outline:2px solid var(--brand);outline-offset:1px}
  .fld{display:block}
  .fld .lbl{margin-bottom:4px;display:block}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .kpi{min-width:0}
  .kpi .v{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:3px;overflow-wrap:anywhere}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:10px}
  th button{background:none;border:0;color:inherit;font:inherit;padding:0}
  th button:hover{color:var(--fg)}
  td{padding:11px 10px;border-top:1px solid var(--border)}
  tbody tr:hover{background:var(--surface2)}
  .twrap{overflow-x:auto}

  .row{display:flex;align-items:center;gap:10px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .muted{color:var(--muted)}
  .clickable{cursor:pointer;transition:.15s}
  .clickable:hover{border-color:var(--brand);transform:translateY(-1px)}
  .bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
  .step{display:flex;gap:12px;align-items:flex-start}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--surface);
    border:1px solid var(--border);box-shadow:var(--shadow);padding:11px 16px;border-radius:12px;
    font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:120}
  .toast.show{opacity:1}
  .avatar{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;flex:0 0 auto}
  .divider{height:1px;background:var(--border);margin:14px 0}
  .link{color:var(--brand);font-weight:600;cursor:pointer}
  .anim{animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .empty{text-align:center;padding:44px 24px}
  .empty .ico{width:56px;height:56px;border-radius:16px;background:var(--brand-soft);color:var(--brand);
    display:grid;place-items:center;margin:0 auto 14px}
  .empty h3{font-size:17px;margin-bottom:6px}
  .empty p{color:var(--muted);font-size:13.5px;margin:0 auto 16px;max-width:400px}

  .modal{position:fixed;inset:0;background:rgba(5,8,18,.6);display:grid;place-items:center;padding:16px;z-index:110}
  .modal .card{width:100%;max-width:520px;max-height:88vh;overflow-y:auto}

  .dot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:99px;background:var(--bad);
    color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
  .dot[hidden]{display:none}
  .panel{position:absolute;right:0;top:44px;width:320px;max-width:calc(100vw - 32px);background:var(--surface);
    border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:8px;z-index:70}
  .notif{padding:9px 10px;border-radius:10px;font-size:13px}
  .notif.un{background:color-mix(in srgb,var(--brand) 7%,transparent)}

  .chatbox{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:340px}
  .msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px}
  .msg{display:flex;gap:10px;max-width:88%}
  .msg.me{flex-direction:row-reverse;align-self:flex-end}
  .bubble{padding:10px 14px;border-radius:16px;background:var(--surface2);font-size:13.5px}
  .msg.me .bubble{background:var(--brand);color:#fff}
  .ava{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;
    background:var(--brand);color:#fff;font-size:12px;font-weight:700}
  .msg.me .ava{background:var(--surface2);color:var(--fg)}

  .chartwrap{position:relative}
  .ctip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;padding:7px 10px;font-size:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .12s;
    white-space:nowrap;z-index:5}
  .ctip.on{opacity:1}
  .vline{position:absolute;top:0;bottom:0;width:1px;background:var(--brand);opacity:0;pointer-events:none}
  .vline.on{opacity:.5}

  @media(max-width:1150px){ .col2{grid-template-columns:1fr!important} }
  @media(max-width:880px){
    .side{position:fixed;z-index:100;transform:translateX(-100%);transition:.2s;box-shadow:var(--shadow)}
    .side.open{transform:none}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .content .grid{grid-template-columns:1fr!important}
    .menu-btn{display:grid!important}
    .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:95}
    .scrim.on{display:block}
    .content,.top{padding-left:16px;padding-right:16px}
  }
  .menu-btn{display:none}

  @media print{
    .side,.top,.no-print{display:none!important}
    body{background:#fff;color:#000}
    .card{box-shadow:none;border:1px solid #ddd}
    .content{padding:0;max-width:100%}
  }
</style>

<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg></span>
      <b>TrafegoAI</b>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="top">
      <div class="row">
        <button class="iconbtn menu-btn" id="menuBtn" aria-label="Abrir menu">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <span class="muted" style="font-size:12.5px" id="topInfo"></span>
      </div>
      <div class="row" style="gap:8px;position:relative">
        <button class="iconbtn" id="bellBtn" aria-label="Notificações">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="dot" id="bellDot" hidden></span>
        </button>
        <button class="iconbtn" id="themeBtn" aria-label="Alternar tema"></button>
        <div id="bellPanel"></div>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   TrafegoAI — painel de tráfego pago.
   Todos os números vêm dos dados que você cadastra.
   Nada é inventado e nada sai deste navegador.
   ═══════════════════════════════════════════════════════════ */

const BRL=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n||0);
const NUM=n=>new Intl.NumberFormat('pt-BR').format(Math.round(n||0));
const CMP=n=>new Intl.NumberFormat('pt-BR',{notation:'compact',maximumFractionDigits:1}).format(n||0);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>(p||'i')+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);
const todayISO=()=>new Date().toISOString().slice(0,10);
const fmtD=iso=>{const[y,m,d]=iso.split('-');return d+'/'+m;};
const fmtDLong=iso=>{const[y,m,d]=iso.split('-');return `${d}/${m}/${y}`;};

const PLAT={google:{n:'Google Ads',s:'Google',c:'#4285F4'},
  meta:{n:'Meta Ads',s:'Meta',c:'#3b82f6'},
  tiktok:{n:'TikTok Ads',s:'TikTok',c:'#14b8a6'},
  outra:{n:'Outra',s:'Outra',c:'#8b8f9e'}};
const PLATS=['google','meta','tiktok','outra'];
const COLORS=['#6d4aff','#16a34a','#d97706','#dc2626','#0ea5e9','#db2777','#0891b2','#7c3aed'];

// ═══ ESTADO ═══
const KEY='trafegoai_dados_v2';
const EMPTY={v:2,theme:null,clients:[],accounts:[],campaigns:[],entries:[],goals:[],rules:[],
  notifs:[],read:[],chat:[],creatives:[],guide:{}};
let S;
function load(){
  try{const raw=localStorage.getItem(KEY);
    S=raw?Object.assign(JSON.parse(JSON.stringify(EMPTY)),JSON.parse(raw)):JSON.parse(JSON.stringify(EMPTY));}
  catch(e){S=JSON.parse(JSON.stringify(EMPTY));}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Não foi possível salvar. O armazenamento do navegador pode estar cheio.');}}
load();

const hasData=()=>S.clients.length>0;
const client=id=>S.clients.find(c=>c.id===id);
const campaign=id=>S.campaigns.find(c=>c.id===id);
const campaignsOf=cid=>S.campaigns.filter(c=>c.clientId===cid);
const entriesOf=campId=>S.entries.filter(e=>e.campaignId===campId);

// ═══ CÁLCULOS (a partir dos seus lançamentos) ═══
const Z={spend:0,rev:0,imp:0,clicks:0,conv:0};
function agg(entries){
  const t=entries.reduce((a,e)=>({spend:a.spend+ +e.spend,rev:a.rev+ +e.rev,imp:a.imp+ +e.imp,
    clicks:a.clicks+ +e.clicks,conv:a.conv+ +e.conv}),{...Z});
  return derive(t);
}
function derive(t){
  const d=(a,b)=>b?a/b:0;
  return{...t,
    roas:+d(t.rev,t.spend).toFixed(2),
    roi:t.spend?Math.round((d(t.rev,t.spend)-1)*100):0,
    lucro:t.rev-t.spend,
    cpa:+d(t.spend,t.conv).toFixed(2),
    cpc:+d(t.spend,t.clicks).toFixed(2),
    cpm:+(d(t.spend,t.imp)*1000).toFixed(2),
    ctr:+(d(t.clicks,t.imp)*100).toFixed(2),
    cr:+(d(t.conv,t.clicks)*100).toFixed(2)};
}
function periodEntries(days,filter){
  let es=S.entries;
  if(filter)es=es.filter(filter);
  if(days==='all')return es;
  const lim=new Date(Date.now()-(days-1)*86400000).toISOString().slice(0,10);
  return es.filter(e=>e.date>=lim);
}
function campTotals(campId,days){
  return agg(periodEntries(days||'all',e=>e.campaignId===campId));
}
function clientTotals(cid,days){
  const ids=campaignsOf(cid).map(c=>c.id);
  return agg(periodEntries(days||'all',e=>ids.includes(e.campaignId)));
}
function seriesByDate(days,filter){
  const es=periodEntries(days,filter);
  const map={};
  es.forEach(e=>{const k=e.date;if(!map[k])map[k]={date:k,spend:0,rev:0};
    map[k].spend+=+e.spend;map[k].rev+=+e.rev;});
  return Object.values(map).sort((a,b)=>a.date<b.date?-1:1);
}

// ═══ GRÁFICOS ═══
function areaChart(data){
  if(data.length<2)return `<div style="height:200px;display:grid;place-items:center" class="muted">
    <p style="font-size:13px;text-align:center;max-width:280px">Registre resultados em pelo menos dois dias diferentes para ver a evolução aqui.</p></div>`;
  const W=680,H=200,pad=10;
  const max=Math.max(...data.map(d=>Math.max(d.spend,d.rev)))*1.1||1;
  const x=i=>pad+i*(W-2*pad)/(data.length-1),y=v=>H-pad-(v/max)*(H-2*pad);
  const line=k=>data.map((d,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(d[k]).toFixed(1)).join(' ');
  const area='M'+x(0)+' '+y(data[0].rev)+data.map((d,i)=>'L'+x(i).toFixed(1)+' '+y(d.rev).toFixed(1)).join('')+
    'L'+x(data.length-1)+' '+(H-pad)+'L'+pad+' '+(H-pad)+'Z';
  return `<div class="chartwrap" id="chartwrap" data-n="${data.length}">
    <svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block;height:200px">
      <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--brand)" stop-opacity=".32"/>
        <stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>
      ${[.25,.5,.75].map(f=>`<line x1="${pad}" x2="${W-pad}" y1="${H*f}" y2="${H*f}" stroke="var(--border)" stroke-dasharray="3 4"/>`).join('')}
      <path d="${area}" fill="url(#ga)"/>
      <path d="${line('rev')}" fill="none" stroke="var(--brand)" stroke-width="2.4"/>
      <path d="${line('spend')}" fill="none" stroke="var(--warn)" stroke-width="2"/>
    </svg>
    <div class="vline" id="vline"></div><div class="ctip" id="ctip"></div></div>`;
}
let chartData=[];
function bindChart(){
  const wrap=document.getElementById('chartwrap');if(!wrap||!chartData.length)return;
  const tip=document.getElementById('ctip'),vl=document.getElementById('vline');
  const move=e=>{
    const r=wrap.getBoundingClientRect();
    const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const frac=Math.max(0,Math.min(1,cx/r.width));
    const i=Math.round(frac*(chartData.length-1)),d=chartData[i];
    if(!d)return;
    const px=(i/(chartData.length-1))*r.width;
    vl.style.left=px+'px';vl.classList.add('on');
    const roas=d.spend?(d.rev/d.spend).toFixed(2):'0';
    tip.innerHTML=`<b>${fmtDLong(d.date)}</b><br>Receita <b class="num">${BRL(d.rev)}</b><br>Investimento <b class="num">${BRL(d.spend)}</b><br>ROAS <b class="num">${roas}x</b>`;
    tip.classList.add('on');
    const tw=tip.offsetWidth||160;
    tip.style.left=Math.max(0,Math.min(r.width-tw,px-tw/2))+'px';tip.style.top='6px';
  };
  const out=()=>{tip.classList.remove('on');vl.classList.remove('on');};
  wrap.addEventListener('mousemove',move);wrap.addEventListener('mouseleave',out);
  wrap.addEventListener('touchstart',move,{passive:true});
  wrap.addEventListener('touchmove',move,{passive:true});
  wrap.addEventListener('touchend',out);
}
function donut(segs){
  const tot=segs.reduce((a,s)=>a+s.v,0);
  if(!tot)return '<p class="muted" style="font-size:13px;text-align:center;padding:30px 0">Sem investimento registrado.</p>';
  let a=-Math.PI/2,out='';const R0=52,R1=78,cx=95,cy=95;
  segs.forEach(s=>{
    if(!s.v)return;
    let ang=s.v/tot*Math.PI*2;
    if(ang>=Math.PI*2)ang=Math.PI*2-.001;
    const b=a+ang,p=(r,t)=>[cx+r*Math.cos(t),cy+r*Math.sin(t)],lg=ang>Math.PI?1:0;
    const[x0,y0]=p(R1,a),[x1,y1]=p(R1,b),[x2,y2]=p(R0,b),[x3,y3]=p(R0,a);
    out+=`<path d="M${x0} ${y0} A${R1} ${R1} 0 ${lg} 1 ${x1} ${y1} L${x2} ${y2} A${R0} ${R0} 0 ${lg} 0 ${x3} ${y3}Z" fill="${s.c}"/>`;
    a=b;});
  return `<svg viewBox="0 0 190 190" width="170" height="170">${out}</svg>`;
}

// ═══ COMPONENTES ═══
function statusPill(s){const m={ativa:['g','Ativa'],pausada:['m','Pausada'],teste:['w','Em teste'],
  conectada:['g','Conectada'],revisar:['w','Revisar'],erro:['b','Com problema']};
  const[c,t]=m[s]||['m',s];return `<span class="pill ${c}">${t}</span>`;}
function platPill(p){const x=PLAT[p]||PLAT.outra;
  return `<span class="pill" style="background:color-mix(in srgb,${x.c} 16%,transparent);color:${x.c}">${x.s}</span>`;}
function kpi(label,val,sub){
  return `<div class="card kpi"><div class="lbl">${label}</div><div class="v num">${val}</div>
    ${sub?`<div class="muted" style="font-size:11.5px;margin-top:3px">${sub}</div>`:''}</div>`;}
function head(t,s,action){
  return `<div class="pagehead between"><div><h1>${t}</h1>${s?`<p>${s}</p>`:''}</div>${action||''}</div>`;}
function empty(icon,title,text,btn){
  return `<div class="card empty"><div class="ico">${icon}</div><h3>${title}</h3><p>${text}</p>${btn||''}</div>`;}

function buildGuide(cid){
  const accs=S.accounts.filter(a=>a.clientId===cid);
  const camps=campaignsOf(cid);
  const ids=camps.map(c=>c.id);
  const ents=S.entries.filter(e=>ids.includes(e.campaignId));
  const gs=S.goals.filter(g=>g.clientId===cid);
  const rs=S.rules.filter(r=>!r.clientId||r.clientId===cid);
  const done=S.guide[cid]||{};
  return [
    {id:'acc',t:'Cadastrar as contas de anúncios',
      d:accs.length?`${accs.length} conta(s) registrada(s).`:'Registre quais contas de anúncios você gerencia para este cliente.',
      done:accs.length>0,act:`onclick="formAccount('${cid}')"`,cta:accs.length?'Ver contas':'Cadastrar conta'},
    {id:'camp',t:'Adicionar as campanhas',
      d:camps.length?`${camps.length} campanha(s) cadastrada(s).`:'Cadastre as campanhas ativas deste cliente.',
      done:camps.length>0,act:`onclick="formCampaign(null,'${cid}')"`,cta:camps.length?'Nova campanha':'Adicionar campanha'},
    {id:'ent',t:'Registrar os resultados',
      d:ents.length?`${ents.length} lançamento(s) — último em ${ents.map(e=>e.date).sort().reverse()[0]?fmtDLong(ents.map(e=>e.date).sort().reverse()[0]):'—'}.`:'Lance investimento, receita, cliques e conversões por data.',
      done:ents.length>0,act:`onclick="formEntry(null,'${cid}')"`,cta:'Registrar resultado'},
    {id:'goal',t:'Definir a meta do cliente',
      d:gs.length?`${gs.length} meta(s) definida(s).`:'Defina uma meta de ROAS, CPA ou investimento para acompanhar.',
      done:gs.length>0,act:`onclick="formGoal('${cid}')"`,cta:gs.length?'Nova meta':'Definir meta'},
    {id:'rule',t:'Criar regra de acompanhamento',
      d:rs.length?`${rs.length} regra(s) criada(s).`:'Crie alertas do tipo "avisar quando o CPA passar de X".',
      done:rs.length>0,act:`onclick="go('regras')"`,cta:'Ir para regras'},
    {id:'rep',t:'Gerar o relatório do cliente',
      d:done.rep?'Relatório já gerado para este cliente.':'Monte um relatório pronto para enviar ou salvar em PDF.',
      done:!!done.rep,act:`onclick="go('relatorio/${cid}')"`,cta:'Abrir relatório'},
  ];
}

function goalRow(g){
  const t=clientTotals(g.clientId,'all');
  const cur=g.metric==='roas'?t.roas:g.metric==='cpa'?t.cpa:t.spend;
  const pct=g.metric==='cpa'?(cur?Math.min(100,g.target/cur*100):0):Math.min(100,g.target?cur/g.target*100:0);
  const ok=g.metric==='cpa'?(cur>0&&cur<=g.target):cur>=g.target;
  const f=v=>g.metric==='roas'?(+v).toFixed(2)+'x':BRL(v);
  return `<div style="padding:9px 0;border-top:1px solid var(--border)">
    <div class="between"><b style="font-size:13px">${esc(g.label)}</b>
      <button class="btn sm" onclick="delGoal('${g.id}')" style="padding:2px 7px">×</button></div>
    <div class="between" style="font-size:12.5px;margin-top:2px">
      <span class="muted">Atual <b class="num" style="color:var(--fg)">${f(cur)}</b></span>
      <span class="muted">Meta <b class="num" style="color:var(--fg)">${f(g.target)}</b></span></div>
    <div class="bar" style="margin-top:6px"><i style="width:${pct.toFixed(0)}%;background:${ok?'var(--good)':'var(--brand)'}"></i></div></div>`;
}

// ── campanhas ──
const F={q:'',plat:'all',status:'all',client:'all',sort:'spend',dir:-1};
function campRows(){
  const days=pdays();
  let r=S.campaigns.map(c=>({...c,m:campTotals(c.id,days)}));
  if(F.plat!=='all')r=r.filter(c=>c.plat===F.plat);
  if(F.status!=='all')r=r.filter(c=>c.status===F.status);
  if(F.client!=='all')r=r.filter(c=>c.clientId===F.client);
  if(F.q){const q=F.q.toLowerCase();r=r.filter(c=>c.name.toLowerCase().includes(q));}
  const cn=id=>(client(id)||{}).name||'';
  return r.sort((a,b)=>{
    let av,bv;
    if(F.sort==='name'){av=a.name;bv=b.name;}
    else if(F.sort==='client'){av=cn(a.clientId);bv=cn(b.clientId);}
    else if(F.sort==='plat'||F.sort==='status'){av=a[F.sort];bv=b[F.sort];}
    else{av=a.m[F.sort];bv=b.m[F.sort];}
    return av>bv?F.dir:av<bv?-F.dir:0;});
}

function aiAnswer(q){
  const ql=q.toLowerCase();
  if(!S.entries.length)
    return 'Ainda não há resultados lançados, então não consigo analisar nada. Cadastre um cliente, adicione as campanhas e registre investimento e receita por data. Assim que houver dados, eu analiso o retorno, aponto onde está o desperdício e sugiro o que escalar.';
  const days=pdays();
  const t=agg(periodEntries(days));
  const camps=S.campaigns.map(c=>({...c,m:campTotals(c.id,days)})).filter(c=>c.m.spend>0);
  const rank=[...camps].sort((a,b)=>b.m.roas-a.m.roas);
  const best=rank[0],worst=rank[rank.length-1];
  const per=PERIOD==='all'?'em todo o período':`nos últimos ${PERIOD} dias`;
  if(/roas|retorno|lucro/.test(ql)){
    let s=`${per.charAt(0).toUpperCase()+per.slice(1)}, você investiu ${BRL(t.spend)} e registrou ${BRL(t.rev)} de receita, o que dá um ROAS de ${t.roas}x e ${t.lucro>=0?'lucro':'prejuízo'} de ${BRL(Math.abs(t.lucro))}.`;
    if(best&&rank.length>1)s+=` A campanha de melhor retorno é "${best.name}" com ${best.m.roas}x, e a de pior retorno é "${worst.name}" com ${worst.m.roas}x.`;
    return s;
  }
  if(/cpa|custo|caro/.test(ql)){
    const comConv=camps.filter(c=>c.m.conv>0).sort((a,b)=>b.m.cpa-a.m.cpa);
    if(!comConv.length)return `Você ainda não registrou conversões, então não dá para calcular o CPA. Lance o número de conversões nos seus resultados para acompanhar esse indicador.`;
    return `Seu CPA médio ${per} é ${BRL(t.cpa)} em ${NUM(t.conv)} conversões. O CPA mais alto está em "${comConv[0].name}" com ${BRL(comConv[0].m.cpa)}, e o mais baixo em "${comConv[comConv.length-1].name}" com ${BRL(comConv[comConv.length-1].m.cpa)}.`;
  }
  if(/desperd|queima|prejuí|ruim|pior/.test(ql)){
    const ruins=camps.filter(c=>c.m.roas<1);
    if(!ruins.length)return `Boa notícia: nenhuma campanha está com ROAS abaixo de 1 ${per}. A de menor retorno é "${worst.name}" com ${worst.m.roas}x, ainda no positivo.`;
    const perdas=ruins.reduce((a,c)=>a+(c.m.spend-c.m.rev),0);
    return `Há ${ruins.length} campanha(s) com retorno abaixo de 1, somando ${BRL(perdas)} a mais em investimento do que em receita: ${ruins.map(c=>`"${c.name}" (${c.m.roas}x)`).join(', ')}. Vale revisar segmentação e criativo ou realocar essa verba.`;
  }
  if(/escal|crescer|aumentar|melhor/.test(ql)){
    if(!best)return 'Ainda não há campanhas com investimento lançado para recomendar escala.';
    return `Para escalar, comece por "${best.name}": ROAS de ${best.m.roas}x com ${BRL(best.m.spend)} investidos e ${BRL(best.m.rev)} de receita. Aumente o orçamento em torno de 20% e acompanhe por alguns dias antes de subir mais.`;
  }
  if(/client|perfil|carteira/.test(ql)){
    const l=S.clients.map(c=>{const ct=clientTotals(c.id,days);return `${c.name} (${ct.spend?ct.roas+'x':'sem dados'})`;});
    return `Você gerencia ${S.clients.length} cliente(s): ${l.join(', ')}. Abra o perfil de cada um para ver o guia de gestão e o que ainda falta configurar.`;
  }
  if(/campanha|quantas|status/.test(ql)){
    return `São ${S.campaigns.length} campanha(s) cadastradas, sendo ${S.campaigns.filter(c=>c.status==='ativa').length} ativas e ${S.campaigns.filter(c=>c.status==='pausada').length} pausadas, com ${S.entries.length} lançamento(s) de resultado. ${camps.length} campanha(s) têm investimento no período.`;
  }
  if(/meta|objetivo/.test(ql)){
    if(!S.goals.length)return 'Você ainda não definiu metas. Vá em Metas e defina um alvo de ROAS, CPA ou investimento por cliente para acompanhar o progresso automaticamente.';
    return `Você tem ${S.goals.length} meta(s) definida(s). Acompanhe o progresso na tela de Metas — o valor atual é calculado a partir dos resultados que você lança.`;
  }
  return `Resumo ${per}: ${BRL(t.spend)} investidos, ${BRL(t.rev)} de receita, ROAS de ${t.roas}x, ${NUM(t.conv)} conversões e CTR de ${t.ctr}%. Posso detalhar por campanha, apontar onde há prejuízo, sugerir o que escalar ou falar sobre suas metas.`;
}

function sendChat(text){

function analyzeVideo(){
  const d=(document.getElementById('vdesc').value||'').trim();
  if(d.length<10){toast('Descreva o roteiro com um pouco mais de detalhe.');return;}
  const dl=d.toLowerCase();
  const pontos=[];
  const temGancho=/começa|abre|primeiro|gancho|pergunta/.test(dl);
  const temProva=/cliente|depoiment|resultado|antes e depois|caso/.test(dl);
  const temCta=/compr|link|clique|chama|cta|bio/.test(dl);
  const temNumero=/\d/.test(d);
  pontos.push(temGancho?{ok:true,t:'A abertura está descrita — bom sinal, é o que decide a retenção.'}
    :{ok:false,t:'Não ficou claro como o vídeo abre. Defina os 3 primeiros segundos: comece pelo problema, não pela apresentação.'});
  pontos.push(temProva?{ok:true,t:'Há prova concreta (caso, depoimento ou resultado), o que aumenta a credibilidade.'}
    :{ok:false,t:'Falta prova concreta. Inclua um caso real, um resultado ou um antes e depois.'});
  pontos.push(temNumero?{ok:true,t:'Você usa números, o que torna a promessa específica e mais crível.'}
    :{ok:false,t:'Sem números a promessa fica vaga. Troque "muitos resultados" por um dado específico.'});
  pontos.push(temCta?{ok:true,t:'Há uma chamada para ação prevista.'}
    :{ok:false,t:'Não há chamada para ação. Diga exatamente o que a pessoa deve fazer no fim.'});
  const score=Math.round(pontos.filter(p=>p.ok).length/pontos.length*100);
  document.getElementById('vresult').innerHTML=`<div class="anim" style="margin-top:14px">
    <div style="padding:12px;border-radius:12px;background:var(--surface2)">
      <div class="between"><b style="font-size:13.5px">Revisão do roteiro</b>
      <span class="pill ${score>=75?'g':score>=50?'w':'b'}">${score}% dos pontos cobertos</span></div></div>
    <div style="margin-top:10px">${pontos.map(p=>`<div class="row" style="align-items:flex-start;gap:8px;padding:7px 0">
      <span style="color:${p.ok?'var(--good)':'var(--warn)'};font-weight:800">${p.ok?'✓':'!'}</span>
      <span style="font-size:13px">${p.t}</span></div>`).join('')}</div>
    <div class="lbl" style="margin:14px 0 6px">Estruturas de abertura que costumam funcionar</div>
    ${['"Se você faz isso, está perdendo dinheiro."','"Testei por 7 dias e aconteceu isto."','"Ninguém te conta o que vem depois."']
      .map(h=>`<p class="muted" style="margin:3px 0;font-size:13px">• ${h}</p>`).join('')}</div>`;
}

function exportData(){
  dl('trafegoai-backup-'+todayISO()+'.json',JSON.stringify(S,null,2),'application/json');
  toast('Backup baixado.');
}
function importData(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||typeof d!=='object'||!Array.isArray(d.clients))throw new Error('formato');
      confirmar('Restaurar backup?',
        `O arquivo tem ${d.clients.length} cliente(s), ${(d.campaigns||[]).length} campanha(s) e ${(d.entries||[]).length} lançamento(s). Isso substitui os dados atuais deste navegador.`,
        'Restaurar',()=>{S=Object.assign(JSON.parse(JSON.stringify(EMPTY)),d);save();toast('Backup restaurado.');go('inicio');});
    }catch(e){toast('Arquivo inválido. Use um backup gerado pelo próprio app.');}
    inp.value='';
  };
  r.readAsText(f);
}
function wipeAll(){
  confirmar('Apagar todos os dados?',
    'Todos os clientes, campanhas e resultados serão removidos deste navegador. Esta ação não pode ser desfeita — baixe um backup antes se quiser guardá-los.',
    'Apagar tudo',()=>{S=JSON.parse(JSON.stringify(EMPTY));save();toast('Dados apagados.');go('inicio');},true);
}

function modal(title,body,footer){

function val(id){const e=document.getElementById(id);return e?(e.value||'').trim():'';}
function numv(id){const v=val(id).replace(/\./g,'').replace(',','.');const n=parseFloat(v);return isNaN(n)?0:n;}
function confirmar(title,text,cta,fn,danger){
  window.__cf=fn;
  modal(title,`<p class="muted" style="font-size:13.5px;margin:0">${text}</p>`,
    `<button class="btn" onclick="closeModal()">Cancelar</button>
     <button class="btn ${danger?'d':'p'}" onclick="var f=window.__cf;closeModal();f&&f()">${cta}</button>`);
}

function pushNotif(msg){
  S.notifs=[{id:uid('n'),msg,at:new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}]
    .concat(S.notifs||[]).slice(0,25);
  save();renderBell();
}
const unread=()=>S.notifs.filter(n=>!S.read.includes(n.id)).length;
let bellOpen=false;
function renderBell(){
  const dot=document.getElementById('bellDot');
  if(dot){const n=unread();dot.hidden=n===0;dot.textContent=n>9?'9+':n;}
  const p=document.getElementById('bellPanel');if(!p)return;
  p.innerHTML=bellOpen?`<div class="panel">
    <div class="between" style="padding:6px 8px 8px"><b style="font-size:13px">Atividade</b>
      ${S.notifs.length?`<button class="link" style="background:none;border:0;font-size:12px" onclick="clearNotifs()">Limpar</button>`:''}</div>
    ${S.notifs.length?S.notifs.slice(0,10).map(x=>`<div class="notif ${S.read.includes(x.id)?'':'un'}">
      <p style="margin:0">${esc(x.msg)}</p><p class="muted" style="margin:2px 0 0;font-size:11.5px">${esc(x.at)}</p></div>`).join('')
      :'<p class="muted" style="padding:10px;font-size:13px;margin:0">Nada por aqui ainda. Suas ações aparecem nesta lista.</p>'}</div>`:'';
}
function markRead(){S.read=S.notifs.map(n=>n.id);save();renderBell();}
function clearNotifs(){S.notifs=[];S.read=[];save();renderBell();}

const PARENT={clientes:'clientes',relatorio:'clientes',campanhas:'campanhas'};
const VIEWS={inicio:viewDashboard,clientes:viewClients,campanhas:viewCampaigns,contas:viewAccounts,
  metas:viewGoals,regras:viewRules,assistente:viewChat,criativos:viewCreatives,
  planejador:viewPlanner,dados:viewData};

function parseHash(){
  const h=(location.hash||'').replace(/^#\/?/,'');
  const[v,p]=h.split('/');
  return{view:v||'inicio',param:p||null};
}
function go(path){location.hash='#/'+path;if(window.innerWidth<=880)closeMenu();}
function renderNav(){
  const{view}=parseHash();const active=PARENT[view]||view;
  document.getElementById('nav').innerHTML=NAV.map(item=>{
    if(item[0]==='SEC')return `<div class="navsec">${item[1]}</div>`;
    const[id,label,path]=item;
    return `<button class="${active===id?'on':''}" onclick="go('${id}')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${path}"/></svg>${label}</button>`;
  }).join('');
}
function render(){
  const{view,param}=parseHash();
  const host=document.getElementById('view');
  let html;
  if(view==='clientes'&&param)html=viewClient(param);
  else if(view==='campanhas'&&param)html=viewCampaign(param);
  else if(view==='relatorio')html=viewReport(param);
  else html=(VIEWS[view]||viewDashboard)();
  host.innerHTML=html;
  renderNav();renderBell();
  host.classList.remove('anim');void host.offsetWidth;host.classList.add('anim');
  if(view==='campanhas'&&!param)renderRows();
  if((view==='inicio'||view==='campanhas')&&document.getElementById('chartwrap'))bindChart();
  if(view==='assistente'){const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight;}
  const foot=document.getElementById('foot');
  foot.innerHTML=hasData()
    ?`${S.clients.length} cliente(s) • ${S.campaigns.length} campanha(s)<br>${S.entries.length} lançamento(s)`
    :'Dados salvos neste navegador';
  document.getElementById('topInfo').textContent=hasData()
    ?`${S.entries.length} lançamento(s) registrados`:'Comece cadastrando um cliente';
  document.title='TrafegoAI';
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});

function toast(m){

}
function curTheme(){return document.documentElement.getAttribute('data-theme')||

  document.getElementById('themeBtn').innerHTML=t==='dark'
    ?'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>'

}

document.getElementById('themeBtn').onclick=()=>{const t=curTheme()==='dark'?'light':'dark';S.theme=t;save();applyTheme(t);};
document.getElementById('bellBtn').onclick=e=>{e.stopPropagation();bellOpen=!bellOpen;
  if(bellOpen)setTimeout(markRead,1200);renderBell();};
document.addEventListener('click',e=>{
  if(bellOpen&&!e.target.closest('#bellPanel')&&!e.target.closest('#bellBtn')){bellOpen=false;renderBell();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMenu();}});

applyTheme(S.theme||curTheme());
if(!location.hash)location.hash='#/inicio';
render();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});
}
</script>

</body>
</html>
