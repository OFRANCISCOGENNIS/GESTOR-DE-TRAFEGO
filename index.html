<body>
<title>TrafegoAI — Gestor de tráfego pago com IA</title>

<meta name="theme-color" content="#6d4aff">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236d4aff'/%3E%3Cpath d='M14 42l12-12 8 8 16-16' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<style>
  :root{
    --bg:#f6f7fb; --surface:#ffffff; --surface2:#eef1f8; --border:#e3e7f1;
    --fg:#161a27; --muted:#5c6379;
    --brand:#6d4aff; --brand2:#9a7bff; --brand-soft:#ece7ff;
    --good:#16a34a; --warn:#d97706; --bad:#dc2626;
    --shadow:0 1px 2px rgba(20,26,50,.06),0 8px 24px rgba(20,26,50,.06);
    --r:16px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0a0d16; --surface:#121727; --surface2:#1a2036; --border:#262d43;
      --fg:#e9ecf5; --muted:#949cb4;
      --brand:#8b6dff; --brand2:#6d4aff; --brand-soft:#221c3f;
      --good:#22c55e; --warn:#f59e0b; --bad:#ef4444;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"]{
    --bg:#f6f7fb; --surface:#ffffff; --surface2:#eef1f8; --border:#e3e7f1;
    --fg:#161a27; --muted:#5c6379; --brand:#6d4aff; --brand2:#9a7bff; --brand-soft:#ece7ff;
    --good:#16a34a; --warn:#d97706; --bad:#dc2626;
    --shadow:0 1px 2px rgba(20,26,50,.06),0 8px 24px rgba(20,26,50,.06);
  }
  :root[data-theme="dark"]{
    --bg:#0a0d16; --surface:#121727; --surface2:#1a2036; --border:#262d43;
    --fg:#e9ecf5; --muted:#949cb4; --brand:#8b6dff; --brand2:#6d4aff; --brand-soft:#221c3f;
    --good:#22c55e; --warn:#f59e0b; --bad:#ef4444;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{max-width:100%;overflow-x:hidden}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;
  }
  .num{font-variant-numeric:tabular-nums}
  h1,h2,h3{margin:0;letter-spacing:-.02em;font-weight:750}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ── shell ── */
  .app{display:flex;min-height:100vh;width:100%}
  .side{
    flex:0 0 250px;align-self:flex-start;position:sticky;top:0;height:100vh;overflow-y:auto;
    background:var(--surface);border-right:1px solid var(--border);
    padding:18px 14px;display:flex;flex-direction:column;gap:4px
  }
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));
    display:grid;place-items:center;color:#fff;flex:0 0 auto}
  .brand b{font-size:18px;letter-spacing:-.03em}
  .nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
  .nav button{
    display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border:0;border-radius:11px;
    background:transparent;color:var(--muted);font-size:14px;font-weight:550;text-align:left;transition:.15s
  }
  .nav button:hover{background:var(--surface2);color:var(--fg)}
  .nav button.on{background:var(--brand);color:#fff}
  .nav svg{width:18px;height:18px;flex:0 0 auto}
  .side .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:8px;line-height:1.5}

  .main{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
  .top{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 24px;background:color-mix(in srgb,var(--surface) 86%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--border)
  }
  .content{padding:22px 24px 60px;max-width:1440px;width:100%;min-width:0}
  .pagehead{margin-bottom:18px}
  .pagehead h1{font-size:24px}
  .pagehead p{margin:5px 0 0;color:var(--muted);font-size:14px}

  /* ── atoms ── */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
  .grid{display:grid;gap:14px}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .pill.g{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
  .pill.w{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
  .pill.b{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
  .pill.m{background:var(--surface2);color:var(--muted)}
  .pill.v{background:var(--brand-soft);color:var(--brand)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:11px;border:1px solid var(--border);
    background:var(--surface2);color:var(--fg);font-size:13.5px;font-weight:600;transition:.15s}
  .btn:hover{border-color:var(--brand)}
  .btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.p:hover{filter:brightness(1.07)}
  .btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
  .iconbtn{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--fg);position:relative}
  .iconbtn:hover{border-color:var(--brand)}
  .up{color:var(--good)} .down{color:var(--bad)}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .inp{width:100%;padding:9px 11px;border-radius:11px;border:1px solid var(--border);background:var(--surface2);color:var(--fg);font-size:13.5px}
  .inp:focus{outline:2px solid var(--brand);outline-offset:1px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .kpi{min-width:0}
  .kpi .v{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:3px;overflow-wrap:anywhere}
  .kpi .d{font-size:11.5px;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:3px}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:10px}
  th button{background:none;border:0;color:inherit;font:inherit;padding:0;display:inline-flex;gap:4px}
  th button:hover{color:var(--fg)}
  td{padding:11px 10px;border-top:1px solid var(--border)}
  tbody tr:hover{background:var(--surface2)}
  .twrap{overflow-x:auto}

  .row{display:flex;align-items:center;gap:10px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .muted{color:var(--muted)}
  .clickable{cursor:pointer;transition:.15s}
  .clickable:hover{border-color:var(--brand);transform:translateY(-1px)}
  .bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
  .step{display:flex;gap:12px;align-items:flex-start}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);
    box-shadow:var(--shadow);padding:11px 16px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:80}
  .toast.show{opacity:1}
  .avatar{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;flex:0 0 auto}
  .divider{height:1px;background:var(--border);margin:14px 0}
  .link{color:var(--brand);font-weight:600;cursor:pointer}
  .anim{animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(5,8,18,.6);display:grid;place-items:center;padding:16px;z-index:90}
  .modal .card{width:100%;max-width:480px;max-height:88vh;overflow-y:auto}

  /* sino */
  .dot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:99px;background:var(--bad);color:#fff;
    font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
  .dot[hidden]{display:none}
  .panel{position:absolute;right:0;top:44px;width:320px;max-width:calc(100vw - 32px);background:var(--surface);
    border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:8px;z-index:70}
  .notif{padding:9px 10px;border-radius:10px;font-size:13px}
  .notif:hover{background:var(--surface2)}
  .notif.un{background:color-mix(in srgb,var(--brand) 7%,transparent)}

  /* chat */
  .chatbox{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:340px}
  .msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px}
  .msg{display:flex;gap:10px;max-width:88%}
  .msg.me{flex-direction:row-reverse;align-self:flex-end}
  .bubble{padding:10px 14px;border-radius:16px;background:var(--surface2);font-size:13.5px}
  .msg.me .bubble{background:var(--brand);color:#fff}
  .ava{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;background:var(--brand);color:#fff;font-size:14px}
  .msg.me .ava{background:var(--surface2);color:var(--fg)}

  /* chart tooltip */
  .chartwrap{position:relative}
  .ctip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:7px 10px;font-size:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .12s;white-space:nowrap;z-index:5}
  .ctip.on{opacity:1}
  .vline{position:absolute;top:0;bottom:0;width:1px;background:var(--brand);opacity:0;pointer-events:none}
  .vline.on{opacity:.5}

  @media(max-width:1150px){ .col2{grid-template-columns:1fr!important} }
  @media(max-width:880px){
    .side{position:fixed;z-index:60;transform:translateX(-100%);transition:.2s;box-shadow:var(--shadow)}
    .side.open{transform:none}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .content .grid{grid-template-columns:1fr!important}
    .menu-btn{display:grid!important}
    .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55}
    .scrim.on{display:block}
    .content,.top{padding-left:16px;padding-right:16px}
  }
  .menu-btn{display:none}

  /* impressão (relatório) */
  @media print{
    .side,.top,.no-print{display:none!important}
    body{background:#fff;color:#000}
    .card{box-shadow:none;border:1px solid #ddd}
    .content{padding:0;max-width:100%}
  }
</style>

<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <span class="logo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>
      </span>
      <b>TrafegoAI</b>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">Google · Meta · TikTok<br><span id="syncInfo"></span></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">

      <div class="row">
        <button class="iconbtn menu-btn" id="menuBtn" aria-label="Abrir menu">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>

      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="modalHost"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   TrafegoAI — painel de tráfego pago (Google, Meta, TikTok)
   Roda inteiro no navegador. Estado salvo em localStorage.
   ═══════════════════════════════════════════════════════════════ */

const BRL = n => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n||0);
const CMP = n => new Intl.NumberFormat('pt-BR',{notation:'compact',maximumFractionDigits:1}).format(n||0);
const NUM = n => new Intl.NumberFormat('pt-BR').format(Math.round(n||0));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ── RNG determinístico ──
function rng(seed){return function(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

// ═══ ESTADO PERSISTIDO ═══
const KEY='trafegoai_state_v1';
const DEFAULT_STATE={theme:null,campaignStatus:{},budgets:{},recStatus:{},rules:{},guide:{},clients:[],
  notifs:[],read:[],chat:[],creatives:[],goalsExtra:[]};
let S;
function loadState(){
  try{const raw=localStorage.getItem(KEY);S=raw?Object.assign({},DEFAULT_STATE,JSON.parse(raw)):Object.assign({},DEFAULT_STATE);}
  catch(e){S=Object.assign({},DEFAULT_STATE);}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
loadState();

// ═══ DADOS BASE ═══
const PLAT={google:{n:'Google',c:'#4285F4'},meta:{n:'Meta',c:'#3b82f6'},tiktok:{n:'TikTok',c:'#14b8a6'}};
const platArr=['google','meta','tiktok'];
const BASE_CLIENTS=[
  {id:'c1',name:'Loja Aurora',color:'#6d4aff',owner:'Marina Alves',email:'marina@lojaaurora.com.br',phone:'(11) 98888-1201',seg:'E-commerce de moda',since:'jan/2025'},
  {id:'c2',name:'FitPro Suplementos',color:'#16a34a',owner:'Rafael Nunes',email:'rafael@fitprosupps.com',phone:'(21) 97777-3410',seg:'Suplementos / saúde',since:'mar/2025'},
  {id:'c3',name:'Studio Bela Pele',color:'#d97706',owner:'Camila Rocha',email:'camila@studiobelapele.com',phone:'(31) 96666-5588',seg:'Estética / skincare',since:'set/2025'},
];
const CNAMES=['Remarketing Quente','Prospecção Fria','Escala Vencedora','Catálogo Dinâmico','Vídeo Depoimento','Público Semelhante 1%','Retargeting Carrinho','Topo de Funil'];

function allClients(){return BASE_CLIENTS.concat(S.clients||[]);}
function findClient(id){return allClients().find(c=>c.id===id);}

// campanhas geradas deterministicamente por cliente
function genCampaigns(client,idx){
  const R=rng(hash(client.id)+7);const rr=(a,b)=>a+R()*(b-a);
  const out=[];
  for(let k=0;k<4;k++){
    const spend=rr(2200,9000),roas=rr(1.2,5.2),rev=spend*roas,
      clicks=Math.round(spend*rr(3,7)),imp=Math.round(clicks*rr(60,120)),
      conv=Math.max(1,Math.round(clicks*rr(.03,.11)));
    const id=client.id+'-k'+k;
    out.push({id,client:client.id,name:CNAMES[Math.floor(R()*CNAMES.length)]+' '+(k+1),
      plat:platArr[(idx+k)%3],status:k===3?'paused':k===2?'learning':'active',
      spend,rev,roas:+roas.toFixed(2),cpa:+(spend/conv).toFixed(2),ctr:+(clicks/imp*100).toFixed(2),
      conv,clicks,imp,budget:Math.round(rr(80,500)),freq:+rr(1.4,6).toFixed(1)});
  }
  return out;
}
function allCampaigns(){
  const list=[];
  allClients().forEach((c,i)=>genCampaigns(c,i).forEach(x=>list.push(x)));
  // aplica overrides salvos
  return list.map(c=>({...c,
    status:S.campaignStatus[c.id]||c.status,
    budget:S.budgets[c.id]!=null?S.budgets[c.id]:c.budget}));
}

const BASE_CONNECTIONS=[
  {id:'x1',client:'c1',plat:'google',acc:'Loja Aurora — Google Ads',status:'active',sync:'há 6 min'},
  {id:'x2',client:'c1',plat:'meta',acc:'Loja Aurora — Meta Business',status:'active',sync:'há 6 min'},
  {id:'x3',client:'c2',plat:'tiktok',acc:'FitPro — TikTok Ads',status:'active',sync:'há 12 min'},
  {id:'x4',client:'c2',plat:'meta',acc:'FitPro — Meta Business',status:'expired',sync:'há 2 dias'},
  {id:'x5',client:'c3',plat:'google',acc:'Bela Pele — Google Ads',status:'error',sync:'há 4 h'},
  {id:'x6',client:'c3',plat:'meta',acc:'Bela Pele — Meta Business',status:'active',sync:'há 20 min'},
];
let connections=BASE_CONNECTIONS.map(c=>({...c}));

const BASE_GOALS=[
  {id:'g1',client:'c1',label:'ROAS Loja Aurora',metric:'roas',cur:3.1,tgt:3.5,proj:3.6},
  {id:'g2',client:'c1',label:'Orçamento mensal',metric:'budget',cur:21400,tgt:30000,proj:29800},
  {id:'g3',client:'c2',label:'CPA-alvo FitPro',metric:'cpa',cur:47,tgt:40,proj:42},
];
function allGoals(){return BASE_GOALS.concat(S.goalsExtra||[]);}

const BASE_RECS=[
  {id:'r1',title:'Realocar 20% da verba para "Escala Vencedora"',impact:'alto',plat:'meta',why:'ROAS 4,8 contra média de 2,1; ainda há espaço de escala e a frequência está saudável.',gain:'+R$ 3.400/mês'},
  {id:'r2',title:'Pausar conjunto "Prospecção Fria 3"',impact:'alto',plat:'google',why:'CPA de R$ 92 (meta R$ 45) há 9 dias, sem conversões nos últimos 3.',gain:'−R$ 1.900 de desperdício'},
  {id:'r3',title:'Trocar criativo com fadiga em "Vídeo Depoimento"',impact:'médio',plat:'tiktok',why:'CTR caiu 38% e a frequência subiu para 5,8 nos últimos 14 dias.',gain:'+0,6 ponto de CTR'},
  {id:'r4',title:'Concentrar lances no pico das 19h–22h',impact:'médio',plat:'google',why:'72% das conversões acontecem nesse intervalo, com CPA 31% menor.',gain:'−14% de CPA'},
];
function allRecs(){return BASE_RECS.map(r=>({...r,status:S.recStatus[r.id]||'open'}));}

const BASE_RULES=[
  {id:'l1',name:'Pausar conjunto caro',on:true,cond:'CPA acima de R$ 60 por 3 dias',act:'Pausar conjunto',floor:20,cap:500,maxpct:100,fires:3,last:'há 12 min'},
  {id:'l2',name:'Escalar vencedora',on:true,cond:'ROAS acima de 4 e frequência abaixo de 3',act:'Aumentar verba em 20%',floor:50,cap:600,maxpct:20,fires:5,last:'há 12 min'},
  {id:'l3',name:'Proteger orçamento',on:false,cond:'Gasto diário acima do teto',act:'Pausar campanha',floor:0,cap:400,maxpct:100,fires:0,last:null},
];
function allRules(){return BASE_RULES.map(r=>({...r,...(S.rules[r.id]||{})}));}

const PRODUCTS=[
  {name:'Mini projetor portátil',cat:'Eletrônicos',mkt:'TikTok Shop',country:'Brasil',score:94,g:120,pmin:89,pmax:249,comp:'média',insight:'Unboxing no escuro com prova social. Vale tráfego pago em Reels e TikTok.'},
  {name:'Escova alisadora 3 em 1',cat:'Beleza',mkt:'Shopee',country:'Brasil',score:88,g:64,pmin:59,pmax:159,comp:'alta',insight:'Antes e depois em 15 segundos. Público feminino 25-44. ROAS alto no Advantage+.'},
  {name:'Garrafa térmica 2L',cat:'Fitness',mkt:'Mercado Livre',country:'Portugal',score:81,g:41,pmin:39,pmax:99,comp:'baixa',insight:'Tendência de hidratação. Vídeo de cliente real com desconto por tempo limitado.'},
  {name:'Massageador EMS de pescoço',cat:'Saúde',mkt:'Amazon',country:'México',score:77,g:33,pmin:79,pmax:199,comp:'média',insight:'Dor de trabalho remoto. Depoimento com garantia. Meta e Google Shopping.'},

const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
function totals(list){

    clicks=sum(list,c=>c.clicks),imp=sum(list,c=>c.imp);
  return{spend,rev,roas:spend?+(rev/spend).toFixed(2):0,roi:spend?Math.round((rev/spend-1)*100):0,

    cpm:imp?+(spend/imp*1000).toFixed(2):0,ctr:imp?+(clicks/imp*100).toFixed(2):0,

function areaChart(data){
  const W=680,H=210,pad=8,max=Math.max(...data.map(d=>Math.max(d.spend,d.rev)))*1.08;
  const x=i=>pad+i*(W-2*pad)/(data.length-1),y=v=>H-pad-(v/max)*(H-2*pad);
  const line=k=>data.map((d,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(d[k]).toFixed(1)).join(' ');
  const area='M'+x(0)+' '+y(data[0].rev)+data.map((d,i)=>'L'+x(i).toFixed(1)+' '+y(d.rev).toFixed(1)).join('')+
    'L'+x(data.length-1)+' '+(H-pad)+'L'+pad+' '+(H-pad)+'Z';
  return `<div class="chartwrap" id="chartwrap">
    <svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block;height:210px">
      <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--brand)" stop-opacity=".33"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>
      ${[.25,.5,.75].map(f=>`<line x1="${pad}" x2="${W-pad}" y1="${H*f}" y2="${H*f}" stroke="var(--border)" stroke-dasharray="3 4"/>`).join('')}
      <path d="${area}" fill="url(#ga)"/>
      <path d="${line('rev')}" fill="none" stroke="var(--brand)" stroke-width="2.4"/>
      <path d="${line('spend')}" fill="none" stroke="var(--warn)" stroke-width="2"/>
      <circle id="chartDot" cx="${x(data.length-1)}" cy="${y(data[data.length-1].rev)}" r="4" fill="var(--brand)"/>
    </svg>
    <div class="vline" id="vline"></div>
    <div class="ctip" id="ctip"></div>
  </div>`;
}
function bindChart(){
  const wrap=document.getElementById('chartwrap');if(!wrap)return;
  const tip=document.getElementById('ctip'),vl=document.getElementById('vline');
  const move=e=>{
    const r=wrap.getBoundingClientRect();
    const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const frac=Math.max(0,Math.min(1,cx/r.width));
    const i=Math.round(frac*(series.length-1));const d=series[i];
    const px=(i/(series.length-1))*r.width;
    vl.style.left=px+'px';vl.classList.add('on');
    tip.innerHTML=`<b>${fmtDate(d.date)}</b><br>Receita: <b class="num">${BRL(d.rev)}</b><br>Gasto: <b class="num">${BRL(d.spend)}</b>`;
    tip.classList.add('on');
    const tw=tip.offsetWidth||150;
    tip.style.left=Math.max(0,Math.min(r.width-tw,px-tw/2))+'px';
    tip.style.top='8px';
  };
  const out=()=>{tip.classList.remove('on');vl.classList.remove('on');};
  wrap.addEventListener('mousemove',move);wrap.addEventListener('mouseleave',out);
  wrap.addEventListener('touchstart',move,{passive:true});wrap.addEventListener('touchmove',move,{passive:true});
  wrap.addEventListener('touchend',out);
}
function donut(segs){
  const tot=sum(segs,s=>s.v)||1;let a=-Math.PI/2;const R0=52,R1=78,cx=95,cy=95;let out='';
  segs.forEach(s=>{const ang=s.v/tot*Math.PI*2,b=a+ang;
    const p=(r,t)=>[cx+r*Math.cos(t),cy+r*Math.sin(t)];const lg=ang>Math.PI?1:0;
    const[x0,y0]=p(R1,a),[x1,y1]=p(R1,b),[x2,y2]=p(R0,b),[x3,y3]=p(R0,a);
    out+=`<path d="M${x0} ${y0} A${R1} ${R1} 0 ${lg} 1 ${x1} ${y1} L${x2} ${y2} A${R0} ${R0} 0 ${lg} 0 ${x3} ${y3}Z" fill="${s.c}"/>`;a=b;});
  return `<svg viewBox="0 0 190 190" width="170" height="170">${out}</svg>`;
}
function spark(seed){
  const R=rng(seed);const vals=Array.from({length:7},()=>30+R()*70);
  const W=150,H=40,mx=Math.max(...vals),mn=Math.min(...vals),rg=mx-mn||1;
  const d=vals.map((v,i)=>(i?'L':'M')+(i*W/6).toFixed(1)+' '+(H-2-((v-mn)/rg)*(H-6)).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="40"><path d="${d}" fill="none" stroke="var(--brand)" stroke-width="2"/></svg>`;
}
function heatmap(){
  const R=rng(99);const days=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];let out='<div style="display:grid;gap:3px">';
  for(let d=0;d<7;d++){
    out+='<div style="display:grid;grid-template-columns:34px repeat(24,1fr);gap:2px;align-items:center">';
    out+=`<span class="lbl" style="font-size:10px">${days[d]}</span>`;
    for(let h=0;h<24;h++){
      const peak=(h>=18&&h<=22)?1.8:(h>=11&&h<=14)?1.2:.5;const wk=(d===0||d===6)?1.2:1;
      const v=Math.min(1,peak*wk*(.5+R()*.6)/2.2);
      out+=`<span title="${days[d]} ${h}h" style="aspect-ratio:1;border-radius:3px;background:color-mix(in srgb,var(--brand) ${Math.round(8+v*88)}%,transparent)"></span>`;
    }
    out+='</div>';
  }
  return out+'</div>';
}

  if(F.q){const q=F.q.toLowerCase();r=r.filter(c=>c.name.toLowerCase().includes(q));}
  const clientName=id=>(findClient(id)||{}).name||'';
  return r.sort((a,b)=>{

    if(F.sort==='name'){av=a.name;bv=b.name;}
    else if(F.sort==='client'){av=clientName(a.client);bv=clientName(b.client);}
    else{av=a[F.sort];bv=b[F.sort];}
    return av>bv?F.dir:av<bv?-F.dir:0;
  });
}

function exportCsv(){

function aiAnswer(q){
  const camps=allCampaigns();const t=totals(camps);const ql=q.toLowerCase();
  const best=[...camps].sort((a,b)=>b.roas-a.roas)[0];
  const worst=[...camps].sort((a,b)=>a.roas-b.roas)[0];
  const paused=camps.filter(c=>c.status==='paused').length;
  if(/roas|retorno/.test(ql))
    return `Seu ROAS consolidado é ${t.roas}x nos últimos 30 dias: ${BRL(t.rev)} de receita sobre ${BRL(t.spend)} investidos. A melhor campanha é "${best.name}" com ${best.roas}x, e a pior é "${worst.name}" com ${worst.roas}x. Vale escalar as acima de 4x e revisar as abaixo de 1,5x.`;
  if(/cpa|custo|caro/.test(ql))
    return `O CPA médio está em ${BRL(t.cpa)} e o CPC em ${BRL(t.cpc)}. O maior ofensor é "${worst.name}", com CPA de ${BRL(worst.cpa)}. Pausar esse conjunto ou trocar o criativo derruba a média rapidamente.`;
  if(/desperd|queima|verba|gast/.test(ql))
    return `Você está desperdiçando principalmente em "${worst.name}": ${BRL(worst.spend)} investidos para ${BRL(worst.rev)} de retorno. Há ${paused} campanha(s) pausada(s) hoje. Sugiro realocar essa verba para "${best.name}", que tem ROAS de ${best.roas}x.`;
  if(/criativ|fadiga|anúncio|video|vídeo/.test(ql))
    return `Identifiquei criativos com sinal de fadiga: frequência acima de 5 combinada com queda de CTR. O caso mais crítico está em "Vídeo Depoimento", com CTR 38% menor em 14 dias. Suba variações novas ainda esta semana para evitar aumento de CPM.`;
  if(/escal|crescer|aumentar/.test(ql))
    return `Para escalar esta semana, comece por "${best.name}" (ROAS ${best.roas}x, frequência saudável): aumente a verba em 20% e acompanhe por 3 dias. Em paralelo, ative a regra "Escalar vencedora" para automatizar isso dentro dos limites de orçamento.`;
  if(/campanha|quantas|status/.test(ql))
    return `Você tem ${camps.length} campanhas em ${allClients().length} clientes: ${camps.filter(c=>c.status==='active').length} ativas, ${camps.filter(c=>c.status==='learning').length} em aprendizado e ${paused} pausadas. O investimento total é de ${BRL(t.spend)} com ${NUM(t.conv)} conversões.`;
  if(/cliente|perfil/.test(ql))
    return `Você gerencia ${allClients().length} perfis: ${allClients().map(c=>c.name).join(', ')}. Abra "Clientes" e escolha um perfil para ver o guia de gestão passo a passo, com o que já está feito e o que falta.`;
  if(/tend|produto|viral|alta/.test(ql))
    return `No radar de hoje, o destaque é "${PRODUCTS[0].name}" com score de demanda ${PRODUCTS[0].score} e crescimento de ${PRODUCTS[0].g}% em 7 dias. Em vídeo, o formato que mais cresce é depoimento em 9:16 com gancho de resultado. Veja a aba Radar para os detalhes.`;
  return `Analisando suas contas: ${BRL(t.spend)} investidos, ${BRL(t.rev)} de receita, ROAS ${t.roas}x, CTR ${t.ctr}% e ${NUM(t.conv)} conversões nos últimos 30 dias. Posso detalhar por campanha, apontar onde há desperdício, sugerir o que escalar ou analisar criativos. É só perguntar.`;
}

const NAV_PARENT={clientes:'clientes',relatorio:'clientes'};

  recomendacoes:viewRecs,chat:viewChat,automacoes:viewAutomations,criativos:viewCreatives,

function parseHash(){
  const h=(location.hash||'').replace(/^#\/?/,'');
  const [v,p]=h.split('/');
  return {view:v||'dashboard',param:p||null};
}
function go(path){
  location.hash='#/'+path;
  if(window.innerWidth<=880)closeMenu();
}
function renderNav(){
  const {view}=parseHash();
  const active=NAV_PARENT[view]||view;
  document.getElementById('nav').innerHTML=NAV.map(([id,label,path])=>
    `<button class="${active===id?'on':''}" onclick="go('${id}')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${path}"/></svg>${label}</button>`).join('');
}
function render(){
  const {view,param}=parseHash();
  const host=document.getElementById('view');
  let html;
  if(view==='clientes'&&param)html=viewClient(param);
  else if(view==='relatorio')html=viewReport(param);
  else html=(VIEWS[view]||viewDashboard)();
  host.innerHTML=html;
  renderNav();renderBell();
  host.classList.remove('anim');void host.offsetWidth;host.classList.add('anim');
  if(view==='campanhas')renderRows();
  if(view==='dashboard')bindChart();
  if(view==='chat'){const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight;}
  document.title=(view==='dashboard'?'Dashboard':view.charAt(0).toUpperCase()+view.slice(1))+' • TrafegoAI';
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});

}
function closeMenu(){
  document.getElementById('side').classList.remove('open');
  document.getElementById('scrim').classList.remove('on');
}

// ═══ INICIALIZAÇÃO ═══
document.getElementById('menuBtn').onclick=toggleMenu;
document.getElementById('scrim').onclick=closeMenu;
document.getElementById('themeBtn').onclick=()=>{
  const t=currentTheme()==='dark'?'light':'dark';
  S.theme=t;save();applyTheme(t);
};
document.getElementById('bellBtn').onclick=e=>{
  e.stopPropagation();bellOpen=!bellOpen;
  if(bellOpen)setTimeout(()=>markAllRead(),1200);
  renderBell();
};
document.addEventListener('click',e=>{
  if(bellOpen&&!e.target.closest('#bellPanel')&&!e.target.closest('#bellBtn')){bellOpen=false;renderBell();}
});

applyTheme(S.theme||currentTheme());
const syncTxt='Atualizado há 6 min';
document.getElementById('syncInfo').textContent=syncTxt;
document.getElementById('topSync').textContent=syncTxt;
if(!location.hash)location.hash='#/dashboard';
render();

// instalação como aplicativo (quando servido por HTTPS)
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});
}
</script>

</body>
</html>
