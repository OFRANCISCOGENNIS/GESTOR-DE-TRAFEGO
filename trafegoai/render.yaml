# Deploy no Render (backend completo: API + worker + Postgres + Redis).
services:
  - type: web
    name: trafegoai-api
    env: node
    rootDir: apps/api
    buildCommand: npm install && npx prisma generate && npx nest build && npx prisma migrate deploy
    startCommand: node dist/main.js
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: trafegoai-db, property: connectionString }
      - key: REDIS_URL
        fromService: { name: trafegoai-redis, type: redis, property: connectionString }
      - { key: JWT_SECRET, generateValue: true }
      - { key: ENCRYPTION_KEY, generateValue: true }

  - type: worker
    name: trafegoai-worker
    env: node
    rootDir: apps/api
    buildCommand: npm install && npx prisma generate && npx nest build
    startCommand: node dist/worker.main.js
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: trafegoai-db, property: connectionString }
      - key: REDIS_URL
        fromService: { name: trafegoai-redis, type: redis, property: connectionString }

  - type: redis
    name: trafegoai-redis
    ipAllowList: []

databases:
  - name: trafegoai-db
